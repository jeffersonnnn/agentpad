[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"          # RH Chain / Uniswap v4 use transient storage
optimizer = true
optimizer_runs = 200
via_ir = false                  # keep false; see rebound viaIR cheatcode gotcha

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"   # chain 4663, public, rate-limited
